name: Browser engine journeys

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }} (headless)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked development dependencies
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'
      - name: Install official Playwright engine and operating-system dependencies
        run: npx playwright-core install --with-deps ${{ matrix.browser }}
      - name: Exercise PWA and standalone journeys
        run: npm run test:cross-browser
        env:
          ANCESTOR_BROWSER: ${{ matrix.browser }}
