# Copy this file to .github/workflows/checks.yml to switch it on.
#
# It lives here because the token that pushes this branch is not allowed to create
# workflow files. That is a permissions fact, not a design decision: the file is
# complete, and enabling it is one copy. Verified 2026-10-28, with the exact
# rejection, so nobody spends another hour rediscovering it:
#
#   ! [remote rejected] arena/... -> arena/... (refusing to allow a GitHub App
#     to create or update workflow `.github/workflows/checks.yml` without
#     `workflows` permission)
#
# Re-confirmed 2026-10-29 by the other route as well — writing the file through
# the contents API rather than a push, in case the rejection was specific to
# refs:
#
#   PUT /repos/{owner}/{repo}/contents/.github/workflows/checks.yml
#   -> 403 Resource not accessible by integration
#
# So it is not the push, and not the branch. The token has no workflows scope.
#
# Two ways to switch it on, either as a person rather than as a token:
#   1. add or edit `.github/workflows/checks.yml` in the GitHub web editor and
#      commit from there — the web editor uses your permissions, not the App's;
#   2. `gh auth refresh -s workflow` where `gh` is authenticated as you, then
#      `git push` this file normally.
#
name: checks

# The ten suites were a habit: they only ran when a person remembered to run
# them. This runs them on every push, plus the build and the landing-page
# verifier. The browser suite is deliberately not here — it needs a Chrome
# binary and it is the one thing that cannot be trusted to a runner that may
# be updated out from under it. Run it with `npm run test:browser`.

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install
        # --ignore-scripts: jsdom needs no postinstall, and puppeteer would try to
        # download a browser this job never uses.
        run: npm install --no-audit --no-fund --ignore-scripts
        working-directory: app

      - name: the ten suites
        working-directory: app
        run: |
          for t in design premium ui run inclusive personas science logic anatomy print; do
            node tests/$t.js
          done

      - name: no untranslated key reaches a screen
        working-directory: app
        run: node tools/keyscan.js

      - name: the QA audit is not allowed to regress
        working-directory: app
        run: |
          node tools/qa_audit.js
          node -e "const r=require('./tools/qa_report.json');const h=r.filter(i=>i.severity==='High');console.log(r.length+' finding(s), '+h.length+' high');process.exit(h.length?1:0)"

      - name: build the single file and use it
        working-directory: app
        run: python3 build.py && node tools/smoke_dist.js

      - name: the landing page
        run: python3 site/build.py && python3 site/check.py
